name: build

on:
  push:
  pull_request:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('tools/deps.sh') }}
      - run: python3 tools/deps_test.py
      - run: make -j4
      - run: python3 tools/doslink_test.py
      - run: make -j4 host-test
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: quickrbasic
          path: |
            build/c/basic32.exe
            build/c/ide32.exe
            build/c/DOS32A.EXE
            build/c/BASIC.HLP
      # from main: the DOS programs zipped to the dos-latest release
      - if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make dos-zip
          gh release delete dos-latest --cleanup-tag --yes || true
          gh release create dos-latest build/c/QuickrBasic-dos.zip --target "$GITHUB_SHA" \
            --prerelease --title "QuickrBasic for DOS (latest)" \
            --notes "IDE32.EXE, BASIC32.EXE, DOS32A.EXE and BASIC.HLP, built from $GITHUB_SHA, with GORILLA.BAS, NIBBLES.BAS, MOTHLITE.BAS, RUSTLINE.BAS and CHARLIE.BAS. Copy them to a DOS machine or DOSBox and run IDE32."
