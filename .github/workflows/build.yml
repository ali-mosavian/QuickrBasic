name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('tools/deps.sh') }}
      - run: make -j4
      - run: make -j4 host-test
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: quickrbasic
          path: |
            build/c/basic32.exe
            build/c/ide32.exe
            build/c/DOS32A.EXE
            build/c/BASIC.HLP
