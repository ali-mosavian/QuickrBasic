name: pages

# The browser IDE (make web) on GitHub Pages: built on every push and PR, deployed from main.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # C23 and wasm32's sjlj need a newer clang than the runner's
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y lld-20
      - run: make -j4 web CLANG=clang-20 WASM_LD=wasm-ld-20
      - run: node tools/wasm/frame_test.mjs build/wasm/ide.wasm
      - run: node tools/wasm/help_test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
