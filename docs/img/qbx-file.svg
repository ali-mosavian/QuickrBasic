<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><marker id="ah059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="32" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">A .qbx file, version 2</text>
<text x="32" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Little-endian. The slices start on 16-byte boundaries; each interface ends with 1Ah, as a source file does.</text>
<rect x="32" y="96" width="310" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="48" y="121.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#312e81" text-anchor="start">header</text>
<text x="326" y="121.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f46e5" text-anchor="end">16 bytes</text>
<rect x="32" y="142" width="310" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="48" y="167.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#312e81" text-anchor="start">entries</text>
<text x="326" y="167.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f46e5" text-anchor="end">24 bytes each: slices, then parts</text>
<rect x="32" y="188" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.25"/>
<text x="48" y="210.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#064e3b" text-anchor="start">slice dos-i386</text>
<text x="326" y="210.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#059669" text-anchor="end">a QXI image</text>
<rect x="32" y="228" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.25"/>
<text x="48" y="250.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#064e3b" text-anchor="start">slice macos</text>
<text x="326" y="250.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#059669" text-anchor="end">a universal dylib</text>
<rect x="32" y="268" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.25"/>
<text x="48" y="290.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#064e3b" text-anchor="start">slice linux-x86_64</text>
<text x="326" y="290.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#059669" text-anchor="end">an ELF .so</text>
<rect x="32" y="308" width="310" height="34" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.25"/>
<text x="48" y="330.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#064e3b" text-anchor="start">slice wasm32</text>
<text x="326" y="330.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#059669" text-anchor="end">a side module</text>
<rect x="32" y="348" width="310" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.25"/>
<text x="48" y="370.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="start">part &quot;&quot;</text>
<text x="326" y="370.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ea580c" text-anchor="end">the module&#x27;s own interface</text>
<rect x="32" y="388" width="310" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.25"/>
<text x="48" y="410.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="start">part &quot;display&quot;</text>
<text x="326" y="410.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ea580c" text-anchor="end">a package&#x27;s module</text>
<rect x="32" y="428" width="310" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.25"/>
<text x="48" y="450.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="start">part &quot;draw&quot;</text>
<text x="326" y="450.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#ea580c" text-anchor="end">and so on, each + 1Ah</text>
<text x="48" y="482" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">a module&#x27;s .qbx has part &quot;&quot; alone; a package&#x27;s, its modules</text>
<text x="440" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="start">header</text>
<rect x="440" y="126" width="132" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="506.0" y="150.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">QBX 1Ah</text>
<text x="442" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">0</text>
<rect x="572" y="126" width="66" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="605.0" y="150.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">format</text>
<text x="574" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">4</text>
<rect x="638" y="126" width="66" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="671.0" y="150.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">abi</text>
<text x="640" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">6</text>
<rect x="704" y="126" width="66" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="737.0" y="150.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">minor</text>
<text x="706" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">8</text>
<rect x="770" y="126" width="66" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="803.0" y="150.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">slices</text>
<text x="772" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">10</text>
<rect x="836" y="126" width="66" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="869.0" y="150.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">parts</text>
<text x="838" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">12</text>
<rect x="902" y="126" width="66" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="935.0" y="150.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">0</text>
<text x="904" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">14</text>
<text x="970" y="120" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">16</text>
<text x="440" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">16 bits each: format 2; abi, the ABI&#x27;s major; minor, the least the host needs;</text>
<text x="440" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">the slices&#x27; and the parts&#x27; counts. Version 1 had no parts: one interface, last.</text>
<text x="440" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="start">entry: a slice&#x27;s or a part&#x27;s</text>
<rect x="440" y="264" width="352" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="616.0" y="288.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">tag or name, 0-padded</text>
<text x="442" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">0</text>
<rect x="792" y="264" width="88" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="836.0" y="288.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">at</text>
<text x="794" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">16</text>
<rect x="880" y="264" width="88" height="40" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.25"/>
<text x="924.0" y="288.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">bytes</text>
<text x="882" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">20</text>
<text x="970" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">24</text>
<text x="440" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">a slice&#x27;s tag: this build&#x27;s pext_tag is loaded, the rest skipped;</text>
<text x="440" y="342" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">a part&#x27;s name: &quot;&quot; the module&#x27;s own, else gfx.qbx/draw is &quot;draw&quot;</text>
<text x="440" y="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#064e3b" text-anchor="start">dos-i386 slice: an image linked at 0 (util/image.c)</text>
