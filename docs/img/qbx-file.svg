<text x="48" y="597" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">io/qbxfile.c reads it: every part must lie inside the file. tools/qbx.py pack writes it; qbx.py strip keeps some slices.</text>
