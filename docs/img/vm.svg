<path d="M352,222 L320,222" fill="none" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#ah4f46e5)"/>
<text x="358" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f46e5" text-anchor="start">ip: its operands, then the next op</text>
<text x="48" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">every line&#x27;s code, compiled by</text>
<text x="48" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">link_start before the run</text>
<text x="48" y="436" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">before it: the statement map</text>
<text x="48" y="454" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">(body offset → code offset)</text>
