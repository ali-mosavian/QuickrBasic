<path d="M910,314 L884,312" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah6b7280)"/>
<text x="916" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">rsp</text>
<text x="706" y="338" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">after I_MUL_V; a Cell: INT, SINGLE, Addr, DOUBLE</text>
