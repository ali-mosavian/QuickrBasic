<text x="386" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#312e81" text-anchor="start">exec_run</text>
<text x="390" y="294" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">for (;;) {</text>
<text x="422" y="314" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">vm.opip = vm.ip;</text>
<text x="422" y="334" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">ops[*vm.ip++](S);</text>
<text x="390" y="354" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">}</text>
<text x="390" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">244 ops (ops.def); CALL k: 185</text>
<text x="390" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">routines (PRINT, INPUT, MID$ ...)</text>
