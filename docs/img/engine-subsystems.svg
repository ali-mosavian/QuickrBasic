<text x="52" y="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">•  one owner per record: only its module assigns its fields</text>
<text x="52" y="484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">•  a routine takes its own record first, and no more than it changes or reads</text>
<text x="52" y="506" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">•  subsystems do not call sideways: the orchestrator passes results, or play posts an event</text>
<text x="52" y="528" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">•  only the orchestrator, main and flow, takes the World</text>
