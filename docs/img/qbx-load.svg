<text x="750.0" y="448.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#064e3b" text-anchor="middle">DOS</text>
<text x="790" y="449" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">a heap block, relocated</text>
<rect x="720" y="466" width="60" height="28" rx="6" fill="#ffffff" stroke="#059669" stroke-opacity="0.55"/>
<text x="750.0" y="484.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#064e3b" text-anchor="middle">Mac</text>
<text x="790" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">cached dylib, dlopen</text>
<rect x="720" y="502" width="60" height="28" rx="6" fill="#ffffff" stroke="#059669" stroke-opacity="0.55"/>
<text x="750.0" y="520.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#064e3b" text-anchor="middle">Linux</text>
<text x="790" y="521" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">memfd_create, dlopen</text>
<rect x="720" y="538" width="60" height="28" rx="6" fill="#ffffff" stroke="#059669" stroke-opacity="0.55"/>
<text x="750.0" y="556.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#064e3b" text-anchor="middle">wasm</text>
<text x="790" y="557" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">side module instantiated</text>
