<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickrBasic</title>
<meta name="description" content="A modern remake of QBasic, QuickBasic and VBDos, in the browser.">
<script src="coi.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #9aa4b2; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 12px; }
  /* the screen's own pixels, square, as DOSBox shows them: 720x400 text, 640x480, 320x200 */
  canvas { image-rendering: pixelated; width: 100%; height: auto; max-height: calc(100vh - 72px);
           object-fit: contain; outline: none; }
  footer { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 8px 16px 14px;
           flex-wrap: wrap; }
  a { color: #7fb4ff; }
  label { cursor: pointer; color: #7fb4ff; }
  input[type=file] { display: none; }
  #status { color: #e6c07b; }
</style>
</head>
<body>
<main><canvas id="screen" width="720" height="400" tabindex="0"></canvas></main>
<footer>
  <span id="status">Loading…</span>
  <label>Open a .BAS or add a .QBX<input id="upload" type="file" accept=".bas,.BAS,.txt,.qbx,.QBX"></label>
  <span>F1 help · Alt the menus · F5 run · files you save stay in this browser</span>
  <span>Based on <a href="https://github.com/ali-mosavian/QuickrBasic">QuickrBasic</a> by Ali Mosavian · AGPL-3.0</span>
</footer>
<script type="module" src="main.mjs"></script>
</body>
</html>
